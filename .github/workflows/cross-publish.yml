name: Cross-Publish Articles

on:
  schedule:
    # Dev.to: weekdays 7 AM UTC
    - cron: '0 7 * * 1-5'
    # Hashnode: weekdays 1 PM UTC
    - cron: '0 13 * * 1-5'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to publish to'
        required: true
        type: choice
        options:
          - devto
          - hashnode
          - both
      slug:
        description: 'Article slug (leave empty for auto-select from unpublished)'
        required: false
        type: string
      dry_run:
        description: 'Dry run: build/validate the request but do not publish publicly (Dev.to posts as unpublished draft; Hashnode skips the publish call)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  cross-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine platform and select article
        id: setup
        env:
          # Hashnode retired FREE GraphQL API access (2026): every mutation now
          # requires a paid Pro plan on the publication, so gql.hashnode.com
          # 301-redirects free requests to a deprecation notice and publishing
          # fails. Hashnode publishing is therefore OFF unless you set a repo
          # variable HASHNODE_ENABLED=true (do that only after upgrading to Pro).
          HASHNODE_ENABLED: ${{ vars.HASHNODE_ENABLED }}
        run: |
          # Determine platform. For scheduled runs, key off the exact cron that
          # triggered the run (github.event.schedule) -- NOT the wall-clock hour,
          # which is unreliable because GitHub delays cron starts (07:00 often
          # fires at ~08:0x, so an hour-based check mis-selected hashnode).
          SCHEDULE="${{ github.event.schedule }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "platform=${{ inputs.platform }}" >> $GITHUB_OUTPUT
          elif [ "$SCHEDULE" = "0 13 * * 1-5" ]; then
            echo "platform=hashnode" >> $GITHUB_OUTPUT
          else
            echo "platform=devto" >> $GITHUB_OUTPUT
          fi

          # Resolve the effective platform for gating below.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            EFFECTIVE_PLATFORM="${{ inputs.platform }}"
          elif [ "$SCHEDULE" = "0 13 * * 1-5" ]; then
            EFFECTIVE_PLATFORM="hashnode"
          else
            EFFECTIVE_PLATFORM="devto"
          fi

          # Skip Hashnode-only runs gracefully when Pro is not enabled, so the
          # job goes GREEN instead of failing daily. Dev.to is unaffected.
          if [ "$EFFECTIVE_PLATFORM" = "hashnode" ] && [ "$HASHNODE_ENABLED" != "true" ]; then
            echo "Hashnode publishing is disabled (free API retired; requires paid Pro)."
            echo "Set repo variable HASHNODE_ENABLED=true after upgrading to enable it."
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "slug=" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Initialize cross-post log if it does not exist
          if [ ! -f .github/cross-post-log.json ]; then
            echo '[]' > .github/cross-post-log.json
          fi

          # Select article
          if [ -n "${{ inputs.slug }}" ]; then
            echo "slug=${{ inputs.slug }}" >> $GITHUB_OUTPUT
          else
            PLATFORM_CHECK="${{ inputs.platform }}"
            if [ -z "$PLATFORM_CHECK" ]; then
              if [ "$SCHEDULE" = "0 13 * * 1-5" ]; then
                PLATFORM_CHECK="hashnode"
              else
                PLATFORM_CHECK="devto"
              fi
            fi

            # Get list of all article slugs
            ALL_SLUGS=$(ls articles/*.md 2>/dev/null | sed 's|articles/||;s|\.md||' | sort)

            # Get already-published slugs for this platform
            if [ "$PLATFORM_CHECK" = "both" ]; then
              PUBLISHED_SLUGS=$(jq -r '.[].slug' .github/cross-post-log.json 2>/dev/null | sort -u)
            else
              PUBLISHED_SLUGS=$(jq -r --arg p "$PLATFORM_CHECK" '.[] | select(.platform == $p) | .slug' .github/cross-post-log.json 2>/dev/null | sort -u)
            fi

            # Find unpublished articles (prefer comparison articles by word count)
            BEST_SLUG=""
            BEST_WC=0

            for SLUG_CANDIDATE in $ALL_SLUGS; do
              # Skip if already published to this platform
              if echo "$PUBLISHED_SLUGS" | grep -qx "$SLUG_CANDIDATE"; then
                continue
              fi

              FILE="articles/${SLUG_CANDIDATE}.md"
              if [ ! -f "$FILE" ]; then
                continue
              fi

              # Extract word count from frontmatter or count words
              WC=$(sed -n '/^---$/,/^---$/p' "$FILE" | grep -E '^word_count:' | head -1 | sed 's/word_count:[[:space:]]*//' | tr -dc '0-9')
              if [ -z "$WC" ] || [ "$WC" = "0" ]; then
                WC=$(awk 'BEGIN{fm=0} /^---$/{fm++; next} fm>=2{print}' "$FILE" | wc -w | tr -d ' ')
              fi

              # Prefer comparison articles (check categories in frontmatter)
              IS_COMPARISON=0
              if sed -n '/^---$/,/^---$/p' "$FILE" | grep -qE 'categories:.*comparison'; then
                IS_COMPARISON=1
              fi

              # Score: comparisons get a 100000 bonus, then sorted by word count
              SCORE=$((IS_COMPARISON * 100000 + WC))

              if [ "$SCORE" -gt "$BEST_WC" ]; then
                BEST_WC="$SCORE"
                BEST_SLUG="$SLUG_CANDIDATE"
              fi
            done

            if [ -z "$BEST_SLUG" ]; then
              echo "No unpublished articles found for platform $PLATFORM_CHECK"
              echo "slug=" >> $GITHUB_OUTPUT
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi

            echo "slug=$BEST_SLUG" >> $GITHUB_OUTPUT
          fi

          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Read and parse article
        if: steps.setup.outputs.skip != 'true'
        id: content
        run: |
          SLUG="${{ steps.setup.outputs.slug }}"
          FILE="articles/${SLUG}.md"

          if [ ! -f "$FILE" ]; then
            echo "Article not found: $FILE"
            echo "found=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "found=true" >> $GITHUB_OUTPUT

          # Extract title from frontmatter
          TITLE=$(sed -n '/^---$/,/^---$/p' "$FILE" | grep -E '^title:' | head -1 | sed 's/title:[[:space:]]*//' | sed 's/^"\(.*\)"$/\1/' | sed "s/^'\(.*\)'$/\1/")
          echo "title=$TITLE" >> $GITHUB_OUTPUT

          # Extract description
          DESC=$(sed -n '/^---$/,/^---$/p' "$FILE" | grep -E '^description:' | head -1 | sed 's/description:[[:space:]]*//' | sed 's/^"\(.*\)"$/\1/' | sed "s/^'\(.*\)'$/\1/")
          echo "description=$DESC" >> $GITHUB_OUTPUT

          # Extract canonical URL
          CANONICAL=$(sed -n '/^---$/,/^---$/p' "$FILE" | grep -E '^canonical_url:' | head -1 | sed 's/canonical_url:[[:space:]]*//' | sed 's/^"\(.*\)"$/\1/' | sed "s/^'\(.*\)'$/\1/")
          if [ -z "$CANONICAL" ]; then
            CANONICAL="https://theluckystrike.github.io/chrome-tips/${SLUG}/"
          fi
          echo "canonical=$CANONICAL" >> $GITHUB_OUTPUT

          # Extract tags (first 4 for devto, 5 for hashnode)
          TAGS_RAW=$(sed -n '/^---$/,/^---$/p' "$FILE" | sed -n '/^tags:/,/^[a-z_]*:/{ /^tags:/d; /^[a-z_]*:/d; p; }' | sed 's/^[[:space:]]*-[[:space:]]*//' | sed 's/^"\(.*\)"$/\1/' | sed "s/^'\(.*\)'$/\1/" | head -5)
          # If tags were inline: tags: [a, b, c]
          if [ -z "$TAGS_RAW" ]; then
            TAGS_RAW=$(sed -n '/^---$/,/^---$/p' "$FILE" | grep -E '^tags:' | head -1 | sed 's/tags:[[:space:]]*//' | tr -d '[]' | tr ',' '\n' | sed 's/^[[:space:]]*//' | sed 's/[[:space:]]*$//' | head -5)
          fi

          # Save tags to a temp file for later use
          echo "$TAGS_RAW" > /tmp/article_tags.txt

          # Strip frontmatter and get body
          BODY=$(awk 'BEGIN{fm=0} /^---$/{fm++; next} fm>=2{print}' "$FILE")
          # Save body to file to avoid shell escaping issues
          echo "$BODY" > /tmp/article_body.md

          WORD_COUNT=$(echo "$BODY" | wc -w | tr -d ' ')
          echo "word_count=$WORD_COUNT" >> $GITHUB_OUTPUT
          echo "Selected: $TITLE ($WORD_COUNT words)"

      - name: Publish to Dev.to
        if: >
          steps.setup.outputs.skip != 'true' &&
          steps.content.outputs.found == 'true' &&
          (steps.setup.outputs.platform == 'devto' || steps.setup.outputs.platform == 'both')
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          SLUG="${{ steps.setup.outputs.slug }}"
          TITLE="${{ steps.content.outputs.title }}"
          CANONICAL="${{ steps.content.outputs.canonical }}"

          # Dry run publishes as an UNPUBLISHED draft so nothing goes public.
          PUBLISHED="true"
          if [ "$DRY_RUN" = "true" ]; then
            PUBLISHED="false"
            echo "DRY RUN: creating an unpublished Dev.to draft (not public)."
          fi

          # Read body from file
          BODY=$(cat /tmp/article_body.md)

          # Build tags array: always start with broad discovery tags, then add up to 2 from article
          ARTICLE_TAGS=$(head -2 /tmp/article_tags.txt | while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            cleaned=$(echo "$tag" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]//g' | cut -c1-30)
            [ -z "$cleaned" ] && continue
            # Skip if it's already one of our broad tags
            [ "$cleaned" = "webdev" ] || [ "$cleaned" = "tutorial" ] && continue
            echo "$cleaned"
          done | jq -R . | jq -s '.')
          TAGS_JSON=$(echo "$ARTICLE_TAGS" | jq '["webdev", "tutorial"] + . | .[0:4]')

          if [ -z "$TAGS_JSON" ] || [ "$TAGS_JSON" = "[]" ]; then
            TAGS_JSON='["chrome", "extensions", "productivity", "webdev"]'
          fi

          echo "Publishing to Dev.to: $TITLE"
          echo "  Canonical: $CANONICAL"
          echo "  Tags: $TAGS_JSON"

          # Build and send the API request
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST "https://dev.to/api/articles" \
            -H "Content-Type: application/json" \
            -H "api-key: ${DEVTO_API_KEY}" \
            -d "$(jq -n \
              --arg title "$TITLE" \
              --arg body "$BODY" \
              --arg canonical "$CANONICAL" \
              --argjson tags "$TAGS_JSON" \
              --argjson published "$PUBLISHED" \
              '{article: {title: $title, body_markdown: $body, published: $published, canonical_url: $canonical, tags: $tags}}')")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          RESPONSE_BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            ARTICLE_URL=$(echo "$RESPONSE_BODY" | jq -r '.url // empty')
            ARTICLE_ID=$(echo "$RESPONSE_BODY" | jq -r '.id // empty')
            if [ "$DRY_RUN" = "true" ]; then
              echo "DRY RUN OK: Dev.to accepted the request (draft id $ARTICLE_ID, url $ARTICLE_URL)."
              echo "Not recording to cross-post log so the article stays available for a real run."
            else
              echo "Published to Dev.to: $ARTICLE_URL"
              echo "devto_url=$ARTICLE_URL" >> $GITHUB_OUTPUT
              echo "devto_id=$ARTICLE_ID" >> $GITHUB_OUTPUT
              # Save for log update step
              echo "$ARTICLE_URL" > /tmp/devto_result_url.txt
              echo "$ARTICLE_ID" > /tmp/devto_result_id.txt
            fi
          elif [ "$HTTP_CODE" = "422" ] && echo "$RESPONSE_BODY" | grep -qi "Canonical url has already been taken"; then
            # A prior run already published this article to Dev.to, but the
            # cross-post log never recorded it (e.g. the log commit lost a
            # push/rebase race), so the selector keeps re-picking it and 422s
            # here every run. Treat it as already published: backfill the log
            # so it is not selected again, and exit green.
            echo "NOTE: Dev.to reports this canonical URL is already published. Backfilling the cross-post log so this article is not re-selected."
            if [ "$DRY_RUN" != "true" ]; then
              echo "$CANONICAL" > /tmp/devto_result_url.txt
              echo "" > /tmp/devto_result_id.txt
            fi
          else
            echo "ERROR: Dev.to API returned HTTP $HTTP_CODE"
            echo "$RESPONSE_BODY" | jq . 2>/dev/null || echo "$RESPONSE_BODY"
            exit 1
          fi

      - name: Publish to Hashnode
        if: >
          steps.setup.outputs.skip != 'true' &&
          steps.content.outputs.found == 'true' &&
          (steps.setup.outputs.platform == 'hashnode' || steps.setup.outputs.platform == 'both')
        env:
          HASHNODE_PAT: ${{ secrets.HASHNODE_PAT }}
          HASHNODE_PUBLICATION_ID: ${{ secrets.HASHNODE_PUBLICATION_ID }}
          HN_TITLE: ${{ steps.content.outputs.title }}
          HN_CANONICAL: ${{ steps.content.outputs.canonical }}
          DRY_RUN: ${{ inputs.dry_run }}
          HN_ENDPOINT: https://gql.hashnode.com/
        run: |
          # Build tags for Hashnode: [{slug,name}] -> /tmp/hn_tags.json
          head -5 /tmp/article_tags.txt | while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            slug=$(echo "$tag" | tr '[:upper:]' '[:lower:]' | tr ' ' '-' | sed 's/[^a-z0-9-]//g')
            jq -n --arg slug "$slug" --arg name "$tag" '{slug: $slug, name: $name}'
          done | jq -s '.' > /tmp/hn_tags.json
          if [ ! -s /tmp/hn_tags.json ] || [ "$(cat /tmp/hn_tags.json)" = "[]" ]; then
            echo '[{"slug":"chrome","name":"Chrome"},{"slug":"extensions","name":"Extensions"}]' > /tmp/hn_tags.json
          fi

          echo "Publishing to Hashnode: $HN_TITLE"
          echo "  Canonical: $HN_CANONICAL"

          # Build the createDraft payload in Python, reading ALL dynamic values
          # from the environment / files (never interpolated into source) so a
          # title with quotes/apostrophes cannot break it.
          HN_TAGS_FILE=/tmp/hn_tags.json HN_BODY_FILE=/tmp/article_body.md python3 -c '
          import json, os
          body = open(os.environ["HN_BODY_FILE"]).read()
          tags = json.load(open(os.environ["HN_TAGS_FILE"]))
          payload = {
              "query": "mutation CreateDraft($input: CreateDraftInput!) { createDraft(input: $input) { draft { id } } }",
              "variables": {"input": {
                  "title": os.environ["HN_TITLE"],
                  "contentMarkdown": body,
                  "publicationId": os.environ["HASHNODE_PUBLICATION_ID"],
                  "tags": tags,
                  "originalArticleURL": os.environ["HN_CANONICAL"],
              }},
          }
          open("/tmp/hn_draft_payload.json","w").write(json.dumps(payload))
          '

          # Hashnode retired free API access: authenticated Pro requests use the
          # RAW token (not "Bearer ..."). Follow redirects (-L) and capture the
          # HTTP code so we can detect the deprecation redirect instead of
          # feeding HTML to jq and dying with a cryptic exit code.
          HTTP_CODE=$(curl -sS -L -o /tmp/hn_draft_resp.json -w '%{http_code}' \
            -X POST "$HN_ENDPOINT" \
            -H "Content-Type: application/json" \
            -H "Authorization: ${HASHNODE_PAT}" \
            --data-binary @/tmp/hn_draft_payload.json) || true

          if ! jq -e . /tmp/hn_draft_resp.json >/dev/null 2>&1; then
            echo "ERROR: Hashnode did not return JSON (HTTP $HTTP_CODE)."
            echo "The free GraphQL API was retired; publishing now requires a paid Hashnode Pro plan."
            head -c 400 /tmp/hn_draft_resp.json; echo
            exit 1
          fi

          DRAFT_ID=$(jq -r '.data.createDraft.draft.id // empty' /tmp/hn_draft_resp.json)
          if [ -z "$DRAFT_ID" ]; then
            echo "ERROR: Failed to create Hashnode draft (HTTP $HTTP_CODE)"
            jq . /tmp/hn_draft_resp.json 2>/dev/null || cat /tmp/hn_draft_resp.json
            exit 1
          fi
          echo "Draft created: $DRAFT_ID"

          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY RUN OK: Hashnode draft created but NOT published. Skipping publishDraft."
            exit 0
          fi

          # Step 2: Publish the draft
          HN_DRAFT_ID="$DRAFT_ID" python3 -c '
          import json, os
          payload = {
              "query": "mutation PublishDraft($input: PublishDraftInput!) { publishDraft(input: $input) { post { id url title slug } } }",
              "variables": {"input": {"draftId": os.environ["HN_DRAFT_ID"]}},
          }
          open("/tmp/hn_publish_payload.json","w").write(json.dumps(payload))
          '

          PUB_CODE=$(curl -sS -L -o /tmp/hn_publish_resp.json -w '%{http_code}' \
            -X POST "$HN_ENDPOINT" \
            -H "Content-Type: application/json" \
            -H "Authorization: ${HASHNODE_PAT}" \
            --data-binary @/tmp/hn_publish_payload.json) || true

          POST_URL=$(jq -r '.data.publishDraft.post.url // empty' /tmp/hn_publish_resp.json 2>/dev/null)
          if [ -n "$POST_URL" ]; then
            echo "Published to Hashnode: $POST_URL"
            echo "$POST_URL" > /tmp/hashnode_result_url.txt
          else
            echo "ERROR: Failed to publish Hashnode draft (HTTP $PUB_CODE)"
            jq . /tmp/hn_publish_resp.json 2>/dev/null || cat /tmp/hn_publish_resp.json
            exit 1
          fi

      - name: Update cross-post log
        if: steps.setup.outputs.skip != 'true' && steps.content.outputs.found == 'true'
        run: |
          SLUG="${{ steps.setup.outputs.slug }}"
          PLATFORM="${{ steps.setup.outputs.platform }}"
          TIMESTAMP=$(date -u '+%Y-%m-%dT%H:%M:%SZ')

          # Initialize log file if needed
          if [ ! -f .github/cross-post-log.json ]; then
            echo '[]' > .github/cross-post-log.json
          fi

          # Record Dev.to result
          if [ -f /tmp/devto_result_url.txt ]; then
            DEVTO_URL=$(cat /tmp/devto_result_url.txt)
            DEVTO_ID=$(cat /tmp/devto_result_id.txt 2>/dev/null || echo "")
            TMP=$(mktemp)
            jq --arg s "$SLUG" --arg p "devto" --arg u "$DEVTO_URL" --arg t "$TIMESTAMP" --arg id "$DEVTO_ID" \
              '. + [{"slug": $s, "platform": $p, "timestamp": $t, "url": $u, "id": $id}]' \
              .github/cross-post-log.json > "$TMP" && mv "$TMP" .github/cross-post-log.json
            echo "Logged Dev.to: $SLUG -> $DEVTO_URL"
          fi

          # Record Hashnode result
          if [ -f /tmp/hashnode_result_url.txt ]; then
            HASHNODE_URL=$(cat /tmp/hashnode_result_url.txt)
            TMP=$(mktemp)
            jq --arg s "$SLUG" --arg p "hashnode" --arg u "$HASHNODE_URL" --arg t "$TIMESTAMP" \
              '. + [{"slug": $s, "platform": $p, "timestamp": $t, "url": $u}]' \
              .github/cross-post-log.json > "$TMP" && mv "$TMP" .github/cross-post-log.json
            echo "Logged Hashnode: $SLUG -> $HASHNODE_URL"
          fi

          # Commit the updated log
          git config user.name "theluckystrike"
          git config user.email "theluckystrike@users.noreply.github.com"
          git add .github/cross-post-log.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update cross-post log: ${SLUG} -> ${PLATFORM}"
            # Pull-rebase in case remote advanced since checkout, then push
            git pull --rebase origin main || true
            git push origin main
            echo "Cross-post log committed and pushed"
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Cross-Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform:** ${{ steps.setup.outputs.platform }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Article:** ${{ steps.setup.outputs.slug }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Title:** ${{ steps.content.outputs.title }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Word count:** ${{ steps.content.outputs.word_count }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f /tmp/devto_result_url.txt ]; then
            echo "- **Dev.to:** $(cat /tmp/devto_result_url.txt)" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f /tmp/hashnode_result_url.txt ]; then
            echo "- **Hashnode:** $(cat /tmp/hashnode_result_url.txt)" >> $GITHUB_STEP_SUMMARY
          fi
