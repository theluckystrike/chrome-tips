<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  {% seo %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Article",
    "headline": "{{ page.title }}",
    "description": "{{ page.description }}",
    "author": {
      "@type": "Person",
      "name": "theluckystrike",
      "url": "https://github.com/theluckystrike"
    },
    "publisher": {
      "@type": "Organization",
      "name": "Chrome Tips Guide",
      "url": "https://chrometipsguide.com"
    },
    "datePublished": "2026-03-10",
    "mainEntityOfPage": "{{ page.url | absolute_url }}"
  }
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; line-height: 1.7; color: #1a1a2e; background: #fafafa; }
    h1 { font-size: 1.8rem; margin-top: 2rem; color: #0f0f23; }
    h2 { font-size: 1.4rem; margin-top: 1.8rem; color: #16213e; border-bottom: 1px solid #e0e0e0; padding-bottom: 0.3rem; }
    a { color: #1a73e8; text-decoration: none; }
    a:hover { text-decoration: underline; }
    code { background: #f0f0f0; padding: 2px 6px; border-radius: 3px; font-size: 0.9em; }
    pre { background: #1a1a2e; color: #e0e0e0; padding: 16px; border-radius: 6px; overflow-x: auto; }
    pre code { background: none; color: inherit; padding: 0; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { border: 1px solid #ddd; padding: 8px 12px; text-align: left; }
    th { background: #f5f5f5; font-weight: 600; }
    blockquote { border-left: 3px solid #1a73e8; margin: 1rem 0; padding: 0.5rem 1rem; background: #f8f9fa; }
    footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid #e0e0e0; color: #666; font-size: 0.85rem; }
    nav { padding: 1rem 0; border-bottom: 1px solid #e0e0e0; margin-bottom: 2rem; }
    nav a { margin-right: 1.5rem; font-weight: 500; }
  </style>
</head>
<body>
  <nav>
    <a href="{{ site.baseurl }}/">Home</a>
    <a href="{{ site.baseurl }}/about/">About</a>
    <a href="{{ site.baseurl }}/articles/best-settings-to-speed-up-chrome-2026/">Speed Tips</a>
    <a href="{{ site.baseurl }}/articles/best-privacy-settings-for-chrome-2026/">Privacy</a>
    <a href="{{ site.baseurl }}/articles/best-chrome-flags-to-speed-up-browsing-2024/">Chrome Flags</a>
  </nav>
  <main>
    {% if page.date %}
    <p style="font-size: 0.85rem; color: #888;">Last updated: {{ page.date | date: "%B %d, %Y" }}</p>
    {% endif %}
    {{ content }}
  </main>
  <footer>
    <p>More guides:
      <a href="https://securetoolsguide.com">Privacy Tools</a> ·
      <a href="https://chrometipsguide.com">Chrome Tips</a> ·
      <a href="https://bestchromeextensions.com">Extensions</a> ·
      <a href="https://bestremotetools.com">AI Tools</a> ·
      <a href="https://welikeremotestack.com">Remote Work</a> ·
      <a href="https://claudecodeguides.com">Claude Code</a>
    </p>
    <p>&copy; 2026 Chrome Tips Guide &middot; <a href="/about/">About</a></p>
  </footer>
</body>
</html>
